services:

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      RECOGNITION_URL: http://recognition:8003
      DB_ECHO: "false"
    ports:
      - "8000:8000"
    depends_on:
      recognition:
        condition: service_healthy
    volumes:
      - db_data:/app/data
      - ./logs:/app/logs

    networks:
      - app_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # детектор растения + сорт + заболевание
  recognition:
    container_name: recognition
    build:
      context: ./recognition
      dockerfile: Dockerfile
    restart: unless-stopped

    volumes:
      - ./recognition/weights:/app/weights:ro

    networks:
      - app_network

    environment:
      LOG_LEVEL: INFO

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./database

networks:
  app_network:
    driver: bridge